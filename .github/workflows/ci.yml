name: CI

on:
  push:
    branches: [version-2]
  pull_request:
    branches: [version-2]

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (unit tests only)
        shell: bash
        run: ./mvnw -B verify -DskipITs
